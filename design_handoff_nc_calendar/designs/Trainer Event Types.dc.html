<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#eceef2; font-family:"Manrope", ui-sans-serif, system-ui, sans-serif; }
    .fdisp { font-family:"Sora", ui-sans-serif, system-ui, sans-serif; letter-spacing:-0.02em; }
    .tnum { font-variant-numeric: tabular-nums; }
    .stepbtn { width:28px; height:28px; border-radius:9999px; border:1px solid #c1c7d0; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#41474f; font-size:16px; line-height:1; }
    :focus-visible{ outline:2px solid #005685; outline-offset:2px; }
  </style>
</helmet>
<div ref="{{ root }}" style="display:flex; width:1440px; min-height:900px; background:linear-gradient(135deg,#f2f3f8,#e7e8ec);">

  <aside style="width:256px; flex-shrink:0; background:rgba(255,255,255,0.4); backdrop-filter:blur(32px); border-right:1px solid rgba(255,255,255,0.2); display:flex; flex-direction:column; padding:8px;">
    <div style="display:flex; align-items:center; gap:8px; padding:8px;">
      <div style="width:32px; height:32px; border-radius:8px; background:#003e62; color:#fff; display:grid; place-items:center; font-weight:800; font-size:13px; flex-shrink:0;">NC</div>
      <div><p class="fdisp" style="font-size:14px; font-weight:600; margin:0; line-height:1;">NC Calendar</p><p style="font-size:12px; color:#717880; margin:4px 0 0;">Studio</p></div>
    </div>
    <div style="padding:16px 8px 4px;"><span style="font-size:11px; font-weight:600; color:#717880; text-transform:uppercase; letter-spacing:0.05em;">Area di lavoro</span></div>
    <nav style="display:flex; flex-direction:column; gap:2px; padding:4px;">
      <a href="Trainer%20Dashboard.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; color:#41474f; font-size:14px; font-weight:500; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>Panoramica</a>
      <a href="Trainer%20Calendar.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; color:#41474f; font-size:14px; font-weight:500; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"/><rect width="18" height="18" x="3" y="4" rx="2"/></svg>Calendario</a>
      <a href="Trainer%20Clients.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; color:#41474f; font-size:14px; font-weight:500; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clienti</a>
      <a href="Trainer%20Event%20Types.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; background:rgba(0,62,98,0.1); color:#003e62; font-size:14px; font-weight:600; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>Tipologie evento</a>
      <a href="Trainer%20Availability.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; color:#41474f; font-size:14px; font-weight:500; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Disponibilità</a>
      <a href="Trainer%20Integrations.dc.html" style="display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:9999px; color:#41474f; font-size:14px; font-weight:500; text-decoration:none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M12 17v5M5 8h14a2 2 0 0 1 2 2v2a7 7 0 0 1-14 0v-2a2 2 0 0 1 2-2Z"/></svg>Integrazioni</a>
    </nav>
    <div style="margin-top:auto; padding:8px;"><div style="border-radius:12px; border:1px solid #c1c7d0; background:#fff; padding:12px;"><p style="font-size:14px; font-weight:500; margin:0;">Marco Rossi</p><p style="font-size:12px; color:#717880; margin:2px 0 0;">marco@ncstudio.it</p></div></div>
  </aside>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
    <header style="height:56px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.2); padding:0 16px; background:rgba(255,255,255,0.4); backdrop-filter:blur(32px);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#41474f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      <div style="height:20px; width:1px; background:rgba(0,0,0,0.15);"></div>
      <p style="font-size:14px; color:#717880; margin:0;">Studio Trainer</p>
    </header>

    <main style="flex:1; background:#f8f9fe; padding:40px;">
      <div style="display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:12px;">
        <div>
          <h1 class="fdisp" style="font-size:36px; font-weight:700; color:#003e62; letter-spacing:-0.02em; margin:0;">Tipologie evento</h1>
          <p style="font-size:14px; color:#41474f; margin:4px 0 0;">La fonte di verità dei tuoi servizi: durata, buffer, prezzo e colore usati da calendario e prenotazioni.</p>
        </div>
        <button id="addtype" style="display:flex; align-items:center; gap:8px; border-radius:9999px; padding:12px 24px; background:#003e62; color:#fff; font-size:14px; font-weight:600; border:none; box-shadow:0 4px 20px rgba(0,86,133,0.05); cursor:pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>Nuova tipologia</button>
      </div>

      <div id="typegrid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:24px;"></div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  root = React.createRef();
  renderVals() { return { root: this.root }; }

  componentDidMount() {
    const el = this.root.current;
    if (!el) return;
    const PALETTE = ["#003e62","#039BE5","#0b8043","#8E24AA","#ea580c","#4361ee"];
    const grid = el.querySelector("#typegrid");

    const DATA = [
      { name:"Sessione PT",     color:"#003e62", dur:60, buffer:15, price:45, book:78 },
      { name:"BIA",             color:"#039BE5", dur:30, buffer:10, price:25, book:24 },
      { name:"Test Funzionale", color:"#0b8043", dur:45, buffer:15, price:40, book:16 },
      { name:"Consulenza",      color:"#8E24AA", dur:40, buffer:10, price:35, book:10 },
    ];

    const stepper = (label, field, unit, val) => `
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:13px; color:#41474f;">${label}</span>
        <span style="display:flex; align-items:center; gap:8px;">
          <button class="stepbtn" data-field="${field}" data-dir="-1">−</button>
          <strong class="tnum" data-val="${field}" style="min-width:64px; text-align:center; color:#191c1f; font-size:14px;">${val}${unit}</strong>
          <button class="stepbtn" data-field="${field}" data-dir="1">+</button>
        </span>
      </div>`;

    const STEP = { dur:5, buffer:5, price:5 };
    const UNIT = { dur:" min", buffer:" min", price:" €" };

    const card = (t) => {
      const c = document.createElement("div");
      c.dataset.color = t.color;
      c.style.cssText = "background:#fff; border-radius:28px; box-shadow:0px 4px 20px rgba(0,86,133,0.05); padding:24px; display:flex; flex-direction:column; gap:16px; position:relative; overflow:hidden;";
      c.innerHTML = `
        <div data-accent style="position:absolute; top:0; left:0; right:0; height:6px; background:${t.color};"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px;">
          <div style="display:flex; align-items:center; gap:12px; min-width:0;">
            <button data-dot title="Cambia colore" style="width:36px; height:36px; border-radius:12px; border:none; background:${t.color}; cursor:pointer; flex-shrink:0;"></button>
            <input data-name value="${t.name}" style="font-size:18px; font-weight:700; color:#191c1f; border:none; background:none; outline:none; width:100%; min-width:0; font-family:inherit;" />
          </div>
          <div data-toggle style="width:40px; height:22px; border-radius:9999px; background:#003e62; position:relative; flex-shrink:0; cursor:pointer; transition:background .15s;"><div style="position:absolute; top:2px; left:20px; width:18px; height:18px; border-radius:9999px; background:#fff; transition:left .15s;"></div></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px; border-top:1px solid #f1f5f9; padding-top:16px;">
          ${stepper("Durata","dur"," min",t.dur)}
          ${stepper("Buffer","buffer"," min",t.buffer)}
          ${stepper("Prezzo","price"," €",t.price)}
        </div>
        <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#717880; border-top:1px solid #f1f5f9; padding-top:12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span class="tnum">${t.book}</span> prenotazioni questo mese
        </div>`;

      // steppers
      c.querySelectorAll(".stepbtn").forEach((b)=>b.onclick=()=>{
        const f = b.dataset.field, dir = +b.dataset.dir;
        t[f] = Math.max(f==="price"?0:5, t[f] + dir*STEP[f]);
        c.querySelector(`[data-val="${f}"]`).textContent = t[f]+UNIT[f];
      });
      // color cycle
      c.querySelector("[data-dot]").onclick = ()=>{
        const i = PALETTE.indexOf(t.color);
        t.color = PALETTE[(i+1) % PALETTE.length];
        c.querySelector("[data-dot]").style.background = t.color;
        c.querySelector("[data-accent]").style.background = t.color;
        c.dataset.color = t.color;
      };
      // active toggle
      let on = true;
      const tog = c.querySelector("[data-toggle]"), knob = tog.firstElementChild;
      tog.onclick = ()=>{
        on = !on;
        tog.style.background = on ? "#003e62" : "#c1c7d0";
        knob.style.left = on ? "20px" : "2px";
        c.style.opacity = on ? "1" : "0.5";
      };
      // name edit
      c.querySelector("[data-name]").oninput = (e)=>{ t.name = e.target.value; };
      return c;
    };

    DATA.forEach((t)=>grid.appendChild(card(t)));

    let addN = 0;
    const PRESETS = [
      { name:"Nuovo servizio", color:"#ea580c", dur:30, buffer:10, price:30, book:0 },
      { name:"Small Group",    color:"#4361ee", dur:60, buffer:15, price:20, book:0 },
    ];
    el.querySelector("#addtype").onclick = ()=>{
      const p = { ...PRESETS[addN % PRESETS.length] }; addN++;
      grid.appendChild(card(p));
    };
  }
}
</script>
</body>
</html>
