      return pool.filter((t) => hash(key(d)+state.type+t) % 3 !== 0);
    };

    const state = { type:"PT", view:new Date(2026,6,1), sel:new Date(2026,6,4), time:"10:00" };
    if (NC) TYPES.forEach((t)=>{ t.left = NC.poolFor(t.key).left; });
    if (initialType && POOL[initialType]) state.type = initialType;
    if (reschedId){ const t=$("#pagetitle"); if(t) t.textContent="Riprogramma"; }

    // ---- Type chips ----
    const typebar = $("#typebar");
    const renderTypes = () => {
      typebar.innerHTML = TYPES.map((t) => {
        const on = t.key===state.type;
        return `<button data-t="${t.key}" style="flex-shrink:0; border-radius:9999px; padding:12px 24px; font-size:14px; font-weight:600; white-space:nowrap; ${on?"background:#005685; color:#ffffff; border:none;":"background:transparent; border:1px solid #c1c7d0; color:#191c1f;"} cursor:pointer;">${t.label}<span style="margin-left:8px; font-size:12px; color:${on?"rgba(255,255,255,0.8)":"#41474f"};">${t.left}</span></button>`;
      }).join("");
      typebar.querySelectorAll("button").forEach((b) => b.onclick = () => {
        state.type = b.dataset.t;
        // keep selected day only if still bookable, else pick first bookable in view
        if (!state.sel || !bookable(state.sel)) state.sel = firstBookable();
        state.time = state.sel ? (slotsFor(state.sel)[1] || slotsFor(state.sel)[0]) : null;
        renderAll();
      });
    };

    const firstBookable = () => {
      const y=state.view.getFullYear(), m=state.view.getMonth();
      const dim=new Date(y,m+1,0).getDate();
      for (let i=1;i<=dim;i++){ const d=new Date(y,m,i); if (bookable(d)) return d; }
      return null;
    };

    // ---- Calendar ----
    const monthLabel = $("#monthlabel");
    const grid = $("#daygrid");
    const renderGrid = () => {
      const y=state.view.getFullYear(), m=state.view.getMonth();
      monthLabel.textContent = MONTHS[m]+" "+y;
      const dim = new Date(y,m+1,0).getDate();
      const lead = (new Date(y,m,1).getDay()+6)%7;
      const head = ["L","M","M","G","V","S","D"].map((d)=>`<div style="font-size:12px; font-weight:600; color:#717880; margin-bottom:8px;">${d}</div>`).join("");
      let cells="";
      for (let i=0;i<lead;i++) cells+=`<div></div>`;
      for (let day=1; day<=dim; day++){
        const d=new Date(y,m,day);
        const ok=bookable(d);
        const selD = state.sel && key(d)===key(state.sel);
        let st="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:14px;border:none;";
        if (selD) st+="background:#005685;color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.05);cursor:pointer;";
        else if (ok) st+="background:none;color:#191c1f;cursor:pointer;";
        else st+="background:none;color:#c1c7d0;cursor:default;";
        cells+=`<div style="display:flex;justify-content:center;padding:4px 0;"><button ${ok?`data-day="${day}"`:"disabled"} style="${st}">${day}</button></div>`;
      }
      grid.innerHTML = head+cells;
      grid.querySelectorAll("button[data-day]").forEach((b)=>b.onclick=()=>{
        state.sel=new Date(y,m,+b.dataset.day);
        state.time=slotsFor(state.sel)[1]||slotsFor(state.sel)[0];
        renderGrid(); renderSlots();
      });
    };

    // ---- Slots ----
    const slotsTitle = $("#slotstitle");
    const slotsGrid = $("#slotsgrid");
    const renderSlots = () => {
      if (!state.sel){ slotsTitle.textContent="Seleziona un giorno"; slotsGrid.innerHTML=`<p style="grid-column:1/-1; font-size:14px; color:#717880; margin:0;">Nessun giorno selezionato.</p>`; updateBar(); return; }
      slotsTitle.textContent = "Orari disponibili per il "+state.sel.getDate()+" "+MONTHS[state.sel.getMonth()];
      const list = slotsFor(state.sel);
      const rec = list[1] || list[0];
      if (!list.length){ slotsGrid.innerHTML=`<p style="grid-column:1/-1; font-size:14px; color:#717880; margin:0;">Nessuno slot libero in questo giorno.</p>`; state.time=null; updateBar(); return; }
      slotsGrid.innerHTML = list.map((t)=>{
        const on=t===state.time;
        const btn = `<button data-time="${t}" class="tnum" style="width:100%; border-radius:9999px; padding:12px 0; font-size:14px; font-weight:600; ${on?"background:#005685;color:#ffffff;border:1px solid #005685;box-shadow:0 1px 2px rgba(0,0,0,0.05);":"background:#ffffff;border:1px solid #c1c7d0;color:#191c1f;"} cursor:pointer;">${t}</button>`;
        if (t===rec && !on)
          return `<div style="position:relative; display:flex; flex-direction:column; align-items:center;"><span style="position:absolute; top:-12px; padding:2px 8px; border-radius:9999px; font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; z-index:10; box-shadow:0 1px 2px rgba(0,0,0,0.1); border:1px solid #ffffff; background:#3b6284; color:#ffffff;">Consigliato</span><button data-time="${t}" class="tnum" style="width:100%; border-radius:9999px; padding:12px 0; font-size:14px; font-weight:600; background:#91cbff; color:#001d32; border:1px solid #005685; box-shadow:0 1px 2px rgba(0,0,0,0.05); cursor:pointer;">${t}</button></div>`;
        return `<div>${btn}</div>`;
      }).join("");
      slotsGrid.querySelectorAll("button[data-time]").forEach((b)=>b.onclick=()=>{ state.time=b.dataset.time; renderSlots(); });
      updateBar();
    };

    // ---- Bottom bar ----
    const bar = $("#confirmbtn").closest("div");
    const renderAll = () => { renderTypes(); renderGrid(); renderSlots(); };
    const updateBar = () => {
      const sum = el.querySelector("#selsummary");
      if (!sum) return;
      if (state.sel && state.time) sum.textContent = state.sel.getDate()+" "+MSHORT[state.sel.getMonth()]+", "+state.time;
      else sum.textContent = "—";
      const cb = el.querySelector("#confirmbtn");
      if (cb) cb.disabled = !(state.sel && state.time);
      if (cb) cb.style.opacity = (state.sel && state.time) ? "1" : "0.5";
    };

    $("#prevmonth").onclick = () => { state.view=new Date(state.view.getFullYear(),state.view.getMonth()-1,1); renderGrid(); };
    $("#nextmonth").onclick = () => { state.view=new Date(state.view.getFullYear(),state.view.getMonth()+1,1); renderGrid(); };
    $("#confirmbtn").onclick = () => {
      if (!(state.sel && state.time)) return;
      const dateISO = NC ? NC.iso(state.sel) : null;
      let id = null;
      if (NC){
        if (reschedId){ NC.reschedule(reschedId, dateISO, state.time); id = reschedId; }
        else { id = NC.book({ type: state.type, date: dateISO, time: state.time }); }
      }
      bar.innerHTML = `<div style="display:flex; align-items:center; gap:12px; width:100%; justify-content:center; color:#0b8043;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span class="fdisp" style="font-weight:600; font-size:18px;">${reschedId?"Riprogrammata":"Prenotato"} · ${state.sel.getDate()} ${MSHORT[state.sel.getMonth()]} ${state.time}</span></div>`;
      if (NC) setTimeout(()=>NC.go("Client Booking Detail.dc.html", id), 950);
    };

    if (NC){
      const back = $("#backbtn"); if (back) back.onclick = ()=>NC.go("home");
      NC.wireNav($("#botnav"), "calendar");
    }

    renderAll();
  }
}</script>
</body>
</html>
